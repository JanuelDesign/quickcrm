<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9E3B" />
      <stop offset="100%" stop-color="#FF8407" />
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#FF8407" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Stylized "Q" with a dynamic CRM / Surfaces diagonal tail -->
  <circle cx="30" cy="30" r="14" stroke="#FFFFFF" stroke-width="7" />
  <path d="M35 35L49 49" stroke="url(#accentGrad)" stroke-width="7.5" stroke-linecap="round" />
  <!-- Small orange status dot representing real-time CRM activity -->
  <circle cx="48" cy="16" r="4.5" fill="#FF8407" />
</svg>
